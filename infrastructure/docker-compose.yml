services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zeusvpn
      POSTGRES_USER: zeusvpn
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeusvpn"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Single process: aiogram polling + the payment webhook HTTP server (port 8443)
  # are started together by bot/main.py. Do NOT run uvicorn separately — a
  # standalone webhook process never imports bot.main, so balance.notify_user /
  # referral.notify_user stay no-op stubs and users get no notifications.
  bot:
    build:
      context: ..
      dockerfile: Dockerfile
    # Host networking, not the default bridge: Timeweb blocks Telegram's IPv4
    # ranges, but IPv6 works fine from the host. Docker's bridge network doesn't
    # pass IPv6 through to containers (EnableIPv6 defaults to false), so a
    # bridged bot container only ever gets NAT'd IPv4 and can't reach
    # api.telegram.org at all. Host mode gives it the host's real IPv6 route.
    network_mode: host
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql+asyncpg://zeusvpn:${DB_PASSWORD}@127.0.0.1:5432/zeusvpn
      REMNAWAVE_URL: ${REMNAWAVE_URL}
      REMNAWAVE_API_TOKEN: ${REMNAWAVE_API_TOKEN}
      REMNAWAVE_DEFAULT_SQUAD_UUID: ${REMNAWAVE_DEFAULT_SQUAD_UUID:-}
      SUBSCRIPTION_HOST: ${SUBSCRIPTION_HOST:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      MIN_TOPUP_RUB: ${MIN_TOPUP_RUB:-100.0}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      BOT_USERNAME: ${BOT_USERNAME}
      PRIVACY_URL: ${PRIVACY_URL:-}
      USER_AGREEMENT_URL: ${USER_AGREEMENT_URL:-}
      SSL_CERT_PATH: ${SSL_CERT_PATH:-}
      SSL_KEY_PATH: ${SSL_KEY_PATH:-}
      WEBHOOK_INSECURE_DEV: ${WEBHOOK_INSECURE_DEV:-0}
    volumes:
      # TLS material for the webhook server; adjust or drop if terminating TLS upstream.
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: python -m bot.main

volumes:
  postgres_data:
